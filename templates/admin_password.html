{% extends "admin_base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<form method="post" class="card-form">
  <h2>비밀번호 변경</h2>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>현재 비밀번호<input type="password" name="current" autocomplete="current-password" required></label>
  <label>새 비밀번호 (8자 이상)<input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
  <label>새 비밀번호 확인<input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
  <div class="form-actions">
    <a class="plain" href="{{ url_for('admin.index') }}">취소</a>
    <button type="submit">변경</button>
  </div>
</form>
{% endblock %}
